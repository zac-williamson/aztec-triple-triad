# Nginx reverse proxy for the Axolotl Arena backend.
# Terminates TLS, forwards HTTP + WebSocket traffic to the Node process on :5174.
# Install path: /etc/nginx/sites-available/triad
# Symlink:      /etc/nginx/sites-enabled/triad

# Required for the WebSocket upgrade. Map the client's Upgrade header
# through so Nginx knows to keep the connection open.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name ws.YOURDOMAIN.com;

  # Let certbot verify the domain during TLS issuance, then redirect everything.
  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name ws.YOURDOMAIN.com;

  # certbot fills these in when you run `certbot --nginx`
  ssl_certificate     /etc/letsencrypt/live/ws.YOURDOMAIN.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ws.YOURDOMAIN.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;

  # Sensible maximum for the JSON payloads (proofs can be ~40KB encoded).
  client_max_body_size 2m;

  # Proxy HTTP (/health) and WebSocket (/) to the backend Node process.
  location / {
    proxy_pass          http://127.0.0.1:5174;
    proxy_http_version  1.1;

    # WebSocket upgrade headers
    proxy_set_header    Upgrade           $http_upgrade;
    proxy_set_header    Connection        $connection_upgrade;

    # Preserve client info for Origin checks and logging
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_set_header    Origin            $http_origin;

    # Games can idle while proofs are generated; keep sockets alive longer
    # than the default 60s read timeout.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    # Disable buffering so messages are relayed in real time.
    proxy_buffering     off;
  }
}
