# Nginx reverse proxy for the Axolotl Arena backend.
# Forwards HTTP (/health) + WebSocket (/) traffic to the Node process on :5174.
# Install path: /etc/nginx/sites-available/triad
# Symlink:      /etc/nginx/sites-enabled/triad
#
# This file is HTTP-ONLY on purpose. `certbot --nginx -d <domain> --redirect`
# injects the `listen 443 ssl` server block, the cert paths, and the 80->443
# redirect itself once a certificate has been issued. Pre-baking an ssl block
# here is a chicken-and-egg: nginx -t fails to load a cert that doesn't exist
# yet, so nginx never starts, so certbot can never run. Keep it HTTP-only and
# let certbot own the TLS block (the provision script runs certbot in step 6).

# Required for the WebSocket upgrade. Map the client's Upgrade header
# through so Nginx knows to keep the connection open.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name ws.YOURDOMAIN.com;

  # Let certbot verify the domain during TLS issuance (HTTP-01 challenge).
  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  # Sensible maximum for the JSON payloads (proofs can be ~40KB encoded).
  client_max_body_size 2m;

  # Proxy HTTP (/health) and WebSocket (/) to the backend Node process.
  # certbot copies this location block verbatim into the 443 server it adds.
  location / {
    proxy_pass          http://127.0.0.1:5174;
    proxy_http_version  1.1;

    # WebSocket upgrade headers
    proxy_set_header    Upgrade           $http_upgrade;
    proxy_set_header    Connection        $connection_upgrade;

    # Preserve client info for Origin checks and logging
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_set_header    Origin            $http_origin;

    # Games can idle while proofs are generated; keep sockets alive longer
    # than the default 60s read timeout.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    # Disable buffering so messages are relayed in real time.
    proxy_buffering     off;
  }
}
