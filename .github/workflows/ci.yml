# ts-tests (E3a): TypeScript unit tests + type-check. Sandbox-free.
# noir-tests (E3b): Aztec toolchain pinned via .aztecrc — contract compile,
# circuit compile + tests, TXE contract tests.
name: CI

on:
  push:
    # Feature branches too: gating only `testnet` meant work reached the
    # deployed branch having never run in a clean environment once.
    branches: [testnet, 'feat/**', 'fix/**']
  pull_request:
    branches: [testnet]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ts-tests:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      # Unit tests never read card art; excluding public/cards keeps the
      # checkout small (same sparse pattern the dev worktrees use).
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !packages/frontend/public/cards
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      # Workspace packages resolve @axolotl-arena/game-logic via dist/
      - name: Build game-logic
        run: npm run build --workspace packages/game-logic

      - name: Game-logic tests
        run: npx vitest run
        working-directory: packages/game-logic

      - name: Backend tests
        run: npx vitest run
        working-directory: packages/backend
        env:
          REDIS_URL: redis://localhost:6379

      - name: Frontend type-check
        run: npx tsc --noEmit
        working-directory: packages/frontend

      - name: Frontend tests
        run: npx vitest run
        working-directory: packages/frontend

      - name: Bot type-check
        run: npx tsc --noEmit
        working-directory: packages/bot

      # The bot's suite includes integration tests that stand up a real relay
      # and play real games over a WebSocket — slower than the rest, and the
      # part most likely to catch a regression in matchmaking or settlement.
      - name: Bot tests
        run: npx vitest run
        working-directory: packages/bot

      # scripts/ isn't an npm workspace, so it's otherwise uncovered.
      # The one live bridge test self-skips without Sepolia creds (it.skipIf
      # on TESTNET_L1_RPC_URL + TREASURY_L1_KEY) → CI-safe: 8 pass, 1 skip.
      - name: Scripts tests
        run: npm run test:scripts

  noir-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A restored toolchain cache must never self-update mid-run.
      AZTEC_NO_AUTO_UPDATE: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !packages/frontend/public/cards
          sparse-checkout-cone-mode: false

      # Aztec tooling (TXE, aztec CLI) runs on the system node; >= 22 required.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # .aztecrc is the single source of truth for the toolchain pin —
      # CI follows it automatically when Lane 1 bumps versions.
      - name: Read toolchain pin
        id: pin
        run: echo "version=$(grep -v '^#' .aztecrc | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Cache Aztec toolchain + CRS + VK cache
        id: aztec-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.aztec
            ~/.bb-crs
            ~/.bb
          key: aztec-${{ runner.os }}-${{ steps.pin.outputs.version }}

      # Fresh install makes ~/.aztec/current the pinned version itself, which
      # sidesteps both 4.3.1 PATH footguns (.aztecrc only honored in $PWD;
      # bare nargo lives in internal-bin, off PATH) — see
      # docs/plan/LANE_1_CHAIN.md ASSUMPTIONS #3/#4.
      # The stock installer is BROKEN on the 5.2 line and fails this job every
      # time. It installs tools into a temp dir, `mv`s them into internal-bin,
      # then deletes the temp dir — but what it moves are SYMLINKS pointing back
      # into that dir, so every one lands dangling. Copying the link target
      # instead (`cp -L`) fixes it; re-running does not.
      #
      # It happens in three places, not one — nargo, noir-profiler and each
      # foundry binary — so the substitution is general rather than the
      # single-line workaround in CLAUDE.md. Patching only foundry gets you past
      # `expected bundled binary 'forge' missing` and into `spawn nargo ENOENT`
      # two steps later, which is a dangling symlink wearing a different hat.
      #
      # This job had been red on every push since the 5.2 migration, which meant
      # no contract or circuit test had run in CI since — the kind of check that
      # teaches you to ignore it.
      - name: Install Aztec toolchain
        if: steps.aztec-cache.outputs.cache-hit != 'true'
        run: |
          V='${{ steps.pin.outputs.version }}'
          curl -fsSL "https://install.aztec-labs.com/$V/install" -o /tmp/aztec-install.sh
          sed -i.bak -E 's|mv "\$temp_([A-Za-z_]+)/bin/([^"]+)"|cp -L "$temp_\1/bin/\2"|g' /tmp/aztec-install.sh
          # Three call sites are expected. Fewer means upstream changed the
          # code — possibly fixing it — and we should look rather than install
          # a layout we no longer understand.
          patched=$(grep -cE 'cp -L "\$temp_[A-Za-z_]+/bin/' /tmp/aztec-install.sh || true)
          echo "patched $patched mv-from-temp call sites"
          if [ "$patched" -lt 3 ]; then
            echo "::warning::expected 3 patched call sites, found $patched — installer may have changed upstream"
          fi
          rm -rf "$HOME/.aztec/versions/$V"
          VERSION="$V" bash /tmp/aztec-install.sh
          # The install script has exited 0 while leaving bin/ empty before, so
          # check what actually landed instead of trusting the exit code.
          test -x "$HOME/.aztec/versions/$V/internal-bin/forge" \
            || { echo "forge still missing after install"; ls -la "$HOME/.aztec/versions/$V/internal-bin" || true; exit 1; }
          # The versioned installer only ever writes to versions/$V — read it
          # and see: AZTEC_HOME/versions/$VERSION/bin is where install_native_symlinks
          # and install_aztec_wrapper put everything, and nothing in the script
          # touches `current` or installs `aztec-up`. Those belong to the
          # wrapper at install.aztec.network, which we are deliberately not
          # using. So point `current` at this version ourselves, which is all
          # `aztec-up use` would have done, and leaves the PATH step below
          # unchanged.
          ln -sfn "$HOME/.aztec/versions/$V" "$HOME/.aztec/current"
          test -x "$HOME/.aztec/current/bin/aztec" \
            || { echo "aztec missing from current/bin"; ls -la "$HOME/.aztec/current/bin" || true; exit 1; }
          test -x "$HOME/.aztec/current/bin/aztec-nargo" \
            || { echo "aztec-nargo missing"; ls -la "$HOME/.aztec/current/bin" || true; exit 1; }
          # `test -x` follows symlinks, so this fails on a DANGLING one — which
          # is the whole failure mode above. `aztec compile` spawns bare nargo
          # from internal-bin via the wrapper's PATH, so it has to resolve.
          test -x "$HOME/.aztec/versions/$V/internal-bin/nargo" \
            || { echo "internal-bin/nargo missing or dangling";
                 ls -la "$HOME/.aztec/versions/$V/internal-bin" || true; exit 1; }

      - name: Add Aztec to PATH
        run: |
          echo "$HOME/.aztec/current/bin" >> "$GITHUB_PATH"
          echo "$HOME/.aztec/current/node_modules/.bin" >> "$GITHUB_PATH"
          echo "$HOME/.aztec/bin" >> "$GITHUB_PATH"
          # internal-bin holds the bare-named tools (nargo, bb, ...). The
          # installer keeps it OFF PATH deliberately, so they cannot shadow a
          # developer's own toolchain, and the `aztec` wrapper is supposed to
          # add it for its own subprocesses. On this runner that did not happen:
          # `aztec compile` died on `spawn nargo ENOENT` with nargo present and
          # executable in internal-bin. A hermetic CI box has no user toolchain
          # to shadow, so put it on PATH and stop depending on the wrapper.
          echo "$HOME/.aztec/current/internal-bin" >> "$GITHUB_PATH"

      # Because three separate guesses at the previous step were wrong, and
      # guessing again without seeing the box is how a fourth would go.
      - name: Toolchain layout
        run: |
          echo "PATH=$PATH"
          echo "--- which ---"; which aztec nargo aztec-nargo bb 2>&1 || true
          echo "--- current/bin ---"; ls -la "$HOME/.aztec/current/bin" || true
          echo "--- internal-bin ---"; ls -la "$HOME/.aztec/current/internal-bin" || true
          echo "--- aztec wrapper ---"; cat "$HOME/.aztec/current/bin/aztec" || true
          aztec --version || true

      # aztec compile, NOT nargo compile — nargo misses AVM transpilation + VKs.
      - name: Compile contracts
        run: aztec compile
        working-directory: packages/contracts

      - name: Compile circuits and run circuit tests
        run: |
          aztec-nargo compile
          aztec-nargo test
        working-directory: circuits

      # Each package gets a fresh TXE — suites assume clean TXE state
      # (long-standing convention from scripts/test-all.sh).
      # --test-threads 1: parallel test functions race TXE's per-test LMDB
      # store setup (mdb_txn_begin EINVAL under load) — same serial-execution
      # constraint as PXE. Diagnosis in LANE_6_ASSETS_INFRA.md ASSUMPTIONS.
      - name: Contract tests (TXE)
        working-directory: packages/contracts
        run: |
          for pkg in arena_token triple_triad_nft triple_triad_game; do
            echo "::group::${pkg}"
            aztec start --txe --port 8081 > "/tmp/txe-${pkg}.log" 2>&1 &
            txe_pid=$!
            # Ready = process alive AND the port actually accepts a connection.
            # The "listening" log line prints a beat before the RPC server
            # accepts, so verify reachability; bail fast if the process dies.
            ready=
            for _ in $(seq 1 120); do
              kill -0 "${txe_pid}" 2>/dev/null || break
              if grep -q "listening on port 8081" "/tmp/txe-${pkg}.log" \
                 && curl -s -o /dev/null --max-time 2 http://127.0.0.1:8081; then
                ready=1; break
              fi
              sleep 1
            done
            if [ -z "${ready}" ]; then
              echo "TXE failed to become ready for ${pkg}:"
              cat "/tmp/txe-${pkg}.log"
              exit 1
            fi
            (cd "${pkg}" && aztec-nargo test --test-threads 1 --oracle-resolver http://127.0.0.1:8081)
            kill "${txe_pid}"
            wait "${txe_pid}" 2>/dev/null || true
            echo "::endgroup::"
          done
